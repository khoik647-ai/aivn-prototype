<style>
.topbar{gap:10px}
.banner{font-size:11px;font-weight:600;color:#c4b5fd;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.4);padding:2px 9px;border-radius:20px;white-space:nowrap}

.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;flex:none}
.seg button{background:transparent;border:none;border-right:1px solid var(--line2);padding:5px 10px;cursor:pointer;color:var(--tx2);font-size:12.5px}

.left{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}

.frow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.list{flex:1;padding:6px 12px 20px}

.m{display:flex;width:100%;text-align:left;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;background:transparent;color:inherit;font:inherit}

.m .meta{font-size:12px;color:var(--tx3);display:flex;gap:4px 10px;margin-top:2px;flex-wrap:wrap}

.fit2{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.fit2::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.fit2.ok{color:var(--ok);background:var(--okbg)}.fit2.warn{color:var(--warn);background:var(--warnbg)}.fit2.bad{color:var(--bad);background:var(--badbg)}
.fit2.chk{color:#38bdf8;background:rgba(56,189,248,.12);border:1px dashed rgba(56,189,248,.7);padding:1px 8px}.fit2.unk{color:var(--tx3);background:var(--panel2)}
.fit2.dot{padding:0;background:none;border:none}.fit2.dot::before{width:8px;height:8px}
.fit2.big{font-size:12.5px;padding:4px 11px}
.howpop{position:absolute;z-index:60;right:14px;top:8px;max-height:calc(100% - 16px);overflow:auto;width:min(560px,calc(100% - 28px));padding:14px 16px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.howpop .ph2{display:flex;align-items:center}.howpop p{margin:8px 0;color:var(--tx2)}
table.th{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0}table.th td,table.th th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}table.th th{color:var(--tx3);font-weight:600}
.detail{width:480px;flex:none;display:flex;flex-direction:column;min-height:0}
.dh{padding:16px 20px 10px}.dh h2{margin:0 0 2px;font-size:18px;word-break:break-word}.rid{word-break:break-all}
.row.tagrow{flex-wrap:wrap}
.fitrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px}.fittxt{flex:1 1 220px;min-width:0}.hflink{flex:none;margin-left:auto;white-space:nowrap}
.topbar h1{white-space:nowrap}
.tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:9px 10px;cursor:pointer;color:var(--tx2);font:inherit;font-size:13px;font-weight:600}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
.pane{flex:1;min-height:0;padding:12px 18px}
.readme{font-size:13px;line-height:1.6;color:var(--tx);overflow-wrap:anywhere}
.readme h3,.readme h4,.readme h5,.readme h6{margin:16px 0 6px;font-size:14.5px}.readme h3{font-size:16px}
.readme p{margin:6px 0}.readme pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;overflow:auto;font-size:12px;white-space:pre}
.readme code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--panel2);padding:0 4px;border-radius:4px}.readme pre code{background:none;padding:0}
.readme .tw{overflow:auto}.readme table{border-collapse:collapse;font-size:12px;margin:6px 0}.readme td,.readme th{border:1px solid var(--line);padding:4px 7px;text-align:left}

.asm{margin:4px 0 8px}.cached{color:#a5b4fc;white-space:nowrap}
.qtable{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 8px}
.q,.qh{display:grid;grid-template-columns:16px minmax(0,1.5fr) 70px 70px 128px 52px;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line)}
.qh{font-size:11px;color:var(--tx3);font-weight:600;background:var(--bg2);padding:6px 10px}
.q{cursor:pointer}.q:last-child{border-bottom:none}.q:hover{background:var(--panel)}.q.sel{background:var(--accbg)}
.q .rad{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2)}.q.sel .rad{border-color:var(--acc);background:radial-gradient(var(--acc) 40%,transparent 45%)}
.q .qn{font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rec{font-size:10.5px;color:var(--ok);display:block;white-space:nowrap;font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:500}.tps{text-align:right}
.dfoot{padding:12px 20px;border-top:1px solid var(--line);background:var(--bg2);flex:none}.dfoot .grow{flex:1}
.memviz{height:10px;border-radius:6px;background:var(--line);position:relative;overflow:visible;margin:8px 0 4px}
.memviz i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}.memviz b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.8}
.dlgo{width:100%;justify-content:center;padding:10px;white-space:normal}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}@keyframes sp{to{transform:rotate(360deg)}}
.mback{display:none}
.dlp{position:fixed;right:498px;bottom:18px;width:400px;max-width:calc(100vw - 24px);z-index:40;box-shadow:0 20px 50px rgba(0,0,0,.5);display:none}
.dlp.open{display:block}
.dlp header{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:600}
.dli{padding:11px 14px;border-bottom:1px solid var(--line)}.dli:last-child{border-bottom:none}
.dli .t{display:flex;justify-content:space-between;gap:8px;font-size:13px}.dli .s{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--tx3);margin-top:5px}
.dlbtn .n{background:var(--acc);color:#fff;border-radius:9px;font-size:10.5px;padding:0 6px;margin-left:2px}
.leftwrap{position:relative;display:flex;flex-direction:column;min-height:0;flex:1}

 .dh{padding:12px 14px 8px}.pane{padding:10px 12px}.tabs{padding:0 8px;overflow-x:auto}.tabs button{min-height:44px;white-space:normal;flex:1 1 0;min-width:0;line-height:1.25;padding:6px 6px}
 .q,.qh{grid-template-columns:14px minmax(0,1fr) auto;padding:8px;row-gap:4px}.qh .qlv{display:none}.q .qlv{grid-column:2/-1}.qsz,.tps{display:none}.tabs,.dh,.mback{flex:none}.q{min-height:48px}
 .dfoot{padding:10px 12px}.dlp{right:12px;left:12px;width:auto}.howpop{position:fixed;left:8px;right:8px;top:8px;bottom:8px;width:auto;max-height:none}#cntrow .grow{display:none}.mseg button b{display:block}
 .detail{min-height:0;overflow:auto}.pane{flex:none;overflow:visible}
}

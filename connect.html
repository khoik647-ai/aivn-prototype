const TPLS=[
 {id:'mail',ic:'📬',name:['Thư ký hộp thư','Inbox assistant','邮箱助理'],d:['Tóm tắt thư mới mỗi sáng, soạn trả lời nháp, nhắc lịch họp.','Summarizes new mail each morning, drafts replies, reminds meetings.','每天早上总结新邮件，起草回复，提醒会议。'],need:['gmail','gcal']},
 {id:'shop',ic:'🛒',name:['Trợ lý bán hàng','Sales assistant','销售助理'],d:['Trả lời khách trên Zalo, tra tồn kho và tạo báo giá trong Kinh doanh.','Answers customers on Zalo, checks stock and creates quotes.','在 Zalo 回复客户，查库存并创建报价。'],need:['zalo','biz']},
 {id:'dev',ic:'🧑‍💻',name:['Trợ lý lập trình','Coding assistant','编程助理'],d:['Đọc mã trên máy, xem issue GitHub, tìm tài liệu trên web.','Reads local code, GitHub issues, searches docs.','读取本地代码、GitHub Issue，搜索文档。'],need:['fs','github','web']},
 {id:'report',ic:'📊',name:['Báo cáo cuối tuần','Weekly report','周报'],d:['Lấy số liệu doanh thu, ghi vào Google Sheets và gửi tóm tắt lên Slack.','Pulls revenue, writes to Sheets and posts a summary to Slack.','提取营收数据，写入表格并在 Slack 发布摘要。'],need:['biz','sheets','slack']},
 {id:'research',ic:'🔎',name:['Nghiên cứu tài liệu','Research helper','资料研究'],d:['Tìm trên web, đọc tài liệu trong Drive và viết tổng hợp vào Notion.','Searches the web, reads Drive docs, writes a summary in Notion.','搜索网页、阅读 Drive 文档，并在 Notion 写总结。'],need:['web','gdrive','notion']},
 {id:'pc',ic:'🖱',name:['Điều khiển máy tính','Computer operator','电脑操控'],d:['Nhìn màn hình, mở ứng dụng, sắp xếp tệp theo yêu cầu.','Sees the screen, opens apps, organizes files on request.','查看屏幕、打开应用、按要求整理文件。'],need:['screen','fs']},

const SAMPLE=`{
  "mcpServers": {
    "filesystem": {
      "command": "npx",
      "args": ["-y", "@modelcontextprotocol/server-filesystem", "C:/Users/Khoi/Desktop"]
    },
    "sqlite-cuahang": {
      "command": "uvx",
      "args": ["mcp-server-sqlite", "--db-path", "D:/data/cuahang.db"]
    },
    "thoi-tiet": {
      "url": "https://mcp.example.vn/weather"
    },
    "github": {
      "command": "npx",
      "args": ["-y", "@modelcontextprotocol/server-github"],
      "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "ghp_xxxxxxxxxxxx" }
    }
  }
}`;
let S=LS.get('aivn.connect',null)||{connected:['biz','web'],custom:[],lang:'vi',agents:[]};
const save=()=>LS.set('aivn.connect',S);
let ui={tab:'all',q:'',mcpText:'',parsed:null,err:'',sel:{},queue:[]};
const T=()=>I18N[S.lang],L=a=>a[{vi:0,en:1,zh:2}[S.lang]];
const nm=c=>Array.isArray(c.name)?L(c.name):c.name;
let lastToast=null;function tt(fn){lastToast=fn;toast(fn())}
const all=()=>BASE.concat(S.custom);
const byId=id=>all().find(c=>c.id===id);
const isOn=id=>S.connected.includes(id);
function ico(c,sz=34){return logoTile(c.logo||'mcp',sz)}
function renderOuter(){
  document.getElementById('cntTop').textContent=S.connected.length;
  document.getElementById('stack').innerHTML=S.connected.slice(0,4).map(id=>{const c=byId(id);return c?logoTile(c.logo||'mcp',20,nm(c)):''}).join('');
  const o=T().o,$=id=>document.getElementById(id);document.documentElement.lang=S.lang==='zh'?'zh-CN':S.lang;
  $('o_draft').textContent='⚠ Bản nháp, chưa phải thiết kế chính thức'+o.draftTr;$('o_draftSub').textContent=o.draftSub;$('o_reset').textContent=o.reset;
  $('o_sub').textContent=o.sub;$('o_sample').textContent=o.sample;$('agName').textContent=o.general;$('o_model').textContent=o.model;$('o_btn').textContent=o.btn;
  $('o_heroH').textContent=o.heroH;$('o_heroP').innerHTML=o.heroP;$('o_heroBtn').textContent=o.btn;
  $('agents').innerHTML=`<div class="grp" style="font-size:11px;color:var(--tx3);padding:4px 8px">${o.grp}</div><div class="ag on">🤖 ${o.general}<small>${o.nApps(S.connected.length)}</small><div class="aglogos">${S.connected.map(id=>{const c=byId(id);return c?logoTile(c.logo||'mcp',18,nm(c)):''}).join('')}</div></div>`+S.agents.map(a=>{const t=TPLS.find(x=>x.id===a);return `<div class="ag">${t.ic} ${L(t.name)}<small>${o.fromTpl}</small><div class="aglogos">${t.need.map(id=>logoTile(byId(id).logo,18,nm(byId(id)))).join('')}</div></div>`}).join('');
}
function render(){
  const t=T();
  document.getElementById('t_title').textContent=t.title;document.getElementById('t_draft').textContent=t.draft;
  document.getElementById('q').placeholder=t.search;document.getElementById('cnt').textContent='● '+t.connected(S.connected.length);
  const ib=document.getElementById('impBtn');ib.textContent=t.imp;ib.classList.toggle('pri',ui.tab==='imp');document.getElementById('t_foot').textContent=t.foot;
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===S.lang));
  const cats=['all','prod','dev','data','comm'].concat(S.custom.length?['custom']:[]).concat(['on']);
  const count=k=>k==='all'?all().length:k==='on'?S.connected.length:all().filter(c=>c.cat===k).length;
  document.getElementById('tabs').innerHTML=cats.map(k=>`<div class="ctab ${ui.tab===k?'on':''}" data-k="${k}">${t.cats[k]}<span class="c">${count(k)}</span></div>`).join('')
    +`<div class="ctab tpl ${ui.tab==='tpl'?'on':''}" data-k="tpl">${t.cats.tpl}</div>`;
  document.querySelectorAll('.ctab').forEach(e=>e.onclick=()=>{ui.tab=e.dataset.k;render()});
  const b=document.getElementById('body');
  if(ui.tab==='imp')b.innerHTML=impView();else if(ui.tab==='tpl')b.innerHTML=tplView();else b.innerHTML=gridView();
  renderOuter();
}
function gridView(){const t=T(),q=ui.q.toLowerCase();
  const list=all().filter(c=>(ui.tab==='all'||(ui.tab==='on'?isOn(c.id):c.cat===ui.tab))&&(nm(c)+' '+L(c.d)).toLowerCase().includes(q));
  if(!list.length)return `<div class="empty">${t.empty}</div>`;
  return `<div class="grid">${list.map(c=>`<div class="card cc ${isOn(c.id)?'on':''}"><div class="t">${ico(c)}<div style="min-width:0"><div class="nm">${nm(c)}</div><span class="kind ${c.kind}">${c.kind==='local'?t.local:c.kind==='mcp'?'MCP · '+(c.url?'HTTP':'stdio'):t.cloud}</span></div></div>
   <div class="d">${L(c.d)}</div>
   <div class="ft">${isOn(c.id)?`<span class="okd">${t.isOn}</span><span style="flex:1"></span><button class="btn sm ghost" onclick="disc('${c.id}')">${t.disconnect}</button>`:`<span style="flex:1"></span><button class="btn sm pri" onclick="ask(['${c.id}'])">${t.connect}</button>`}</div></div>`).join('')}</div>`}
function tplView(){const t=T();return `<div class="tg">${TPLS.map(p=>{const miss=p.need.filter(id=>!isOn(id)),used=S.agents.includes(p.id);
  return `<div class="card tc"><div class="row"><span style="font-size:24px">${p.ic}</span><b style="font-size:14.5px">${L(p.name)}</b><span style="flex:1"></span>${miss.length?'':`<span class="okd">${t.ready}</span>`}</div>
  <div class="small" style="color:var(--tx2)">${L(p.d)}</div>
  <div class="need"><span class="small muted">${t.needs}</span>${p.need.map(id=>{const c=byId(id);return `<span class="nchip ${isOn(id)?'ok':''}">${logoTile(c.logo||'mcp',15)} ${nm(c)} ${isOn(id)?'✓':''}</span>`}).join('')}</div>
  <div class="row" style="margin-top:4px">${used?`<span class="okd">${t.inUse}</span>`:miss.length?`<button class="btn sm" onclick="ask(${JSON.stringify(miss).replace(/"/g,"'")},'${p.id}')">🔌 ${t.connectMissing(miss.length)}</button>`:`<button class="btn sm pri" onclick="useTpl('${p.id}')">${t.use}</button>`}</div></div>`}).join('')}</div>`}
function impView(){const t=T(),p=ui.parsed;
  return `<div class="small" style="color:var(--tx2);margin-bottom:8px">${t.mcpHint}</div>
  <textarea class="inp code" id="mcpTxt" placeholder='{ "mcpServers": { … } }'>${ui.mcpText.replace(/</g,'&lt;')}</textarea>
  <div class="row" style="margin-top:8px"><button class="btn sm" onclick="document.getElementById('file').click()">${t.pick}</button><button class="btn sm ghost" onclick="ui.mcpText=SAMPLE;ui.parsed=null;render()">${t.sample}</button><span style="flex:1"></span><button class="btn sm pri" onclick="parse()">${t.parse}</button></div>
  ${ui.err?`<div class="err">${ui.err}</div>`:''}
  ${p?`<div style="margin-top:14px" class="row"><b>${t.found(p.length)}</b></div>
   <div class="card" style="margin-top:8px">${p.map((s,i)=>{const ex=all().some(c=>c.id==='mcp-'+s.name);return `<label class="srv"><input type="checkbox" ${ui.sel[i]&&!ex?'checked':''} ${ex?'disabled':''} onchange="ui.sel[${i}]=this.checked;render()">
     <b style="min-width:120px">${s.name}</b><span class="kind">${s.url?'HTTP':'stdio'}</span><code>${s.url||[s.command].concat(s.args||[]).join(' ')}</code>
     ${s.env?`<span class="small muted" title="${Object.keys(s.env).join(', ')}">🔑 ${Object.keys(s.env).length} ${t.envHidden}</span>`:''}${ex?`<span class="small muted">(${t.exists})</span>`:''}</label>`}).join('')}</div>
   ${p.some(s=>!s.url)?`<div class="small" style="color:var(--warn);margin-top:8px">${t.warnCmd}</div>`:''}
   <div class="row" style="margin-top:10px"><span style="flex:1"></span><button class="btn pri" onclick="addParsed()" ${Object.values(ui.sel).filter(Boolean).length?'':'disabled'}>${t.addSel(p.filter((s,i)=>ui.sel[i]&&!all().some(c=>c.id==='mcp-'+s.name)).length)}</button></div>`:''}`}
function parse(){const t=T();ui.mcpText=document.getElementById('mcpTxt').value;ui.err='';ui.parsed=null;
  try{const j=JSON.parse(ui.mcpText);const m=j.mcpServers||j.servers;if(!m||typeof m!=='object'){ui.err=t.noServers;return render()}
   ui.parsed=Object.entries(m).map(([name,v])=>({name,command:v.command,args:v.args,url:v.url,env:v.env&&Object.keys(v.env).length?Object.fromEntries(Object.keys(v.env).map(k=>[k,'••••'])):null}));
   ui.sel={};ui.parsed.forEach((s,i)=>ui.sel[i]=true);}catch(e){ui.err=t.badJson+e.message}render()}
function addParsed(){const t=T();let n=0;ui.parsed.forEach((s,i)=>{if(!ui.sel[i]||all().some(c=>c.id==='mcp-'+s.name))return;n++;
  S.custom.push({id:'mcp-'+s.name,name:s.name,cat:'custom',kind:'mcp',logo:'mcp',c:'#7c3aed',l:'⚙',url:s.url||null,perms:['mcpRun','mcpTool'],cmd:s.url||[s.command].concat(s.args||[]).join(' '),
   d:[`Máy chủ MCP · ${s.url?'HTTP':s.command}`,`MCP server · ${s.url?'HTTP':s.command}`,`MCP 服务器 · ${s.url?'HTTP':s.command}`]})});
  save();tt(()=>T().added(n));ui.parsed=null;ui.mcpText='';ui.tab='custom';render()}
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{ui.mcpText=x;render();parse()});e.target.value=''};
// thẻ xin phép, xử lý lần lượt
let afterQueue=null;
function ask(ids,tpl){ui.queue=ids.slice();afterQueue=tpl||null;showPerm()}
function showPerm(){const t=T();const id=ui.queue[0];const bg=document.getElementById('permBg');if(!id){bg.classList.remove('open');if(afterQueue&&TPLS.find(x=>x.id===afterQueue).need.every(isOn))useTpl(afterQueue);afterQueue=null;render();return}
  const c=byId(id);bg.classList.add('open');
  document.getElementById('perm').innerHTML=`<div class="top"><div class="link"><span class="ico" style="background:linear-gradient(135deg,var(--acc),var(--acc2))">AI</span><span class="dots">• • •</span>${ico(c)}</div>
   <h3>${t.permTitle(nm(c))}</h3><div class="small muted">${t.permSub}</div>${ui.queue.length>1?`<div class="small" style="margin-top:6px;color:var(--acc)">1 / ${ui.queue.length}</div>`:''}</div>
   <div class="plist">${c.perms.map(k=>{const p=PERMS[k];return `<div class="pi"><span>${p[0]==='r'?'👁':p[0]==='w'?'✏️':'✋'}</span><span>${L(p.slice(1))}</span><span class="lvl ${p[0]}">${t.lv[p[0]]}</span></div>`}).join('')}</div>
   ${c.folder?`<div class="scope"><span class="muted">${t.folder}</span> <code style="background:var(--bg);padding:2px 6px;border-radius:5px">${c.folder}</code></div>`:''}
   ${c.cmd?`<div class="scope"><code style="background:var(--bg);padding:2px 6px;border-radius:5px;font-size:11.5px">${c.cmd}</code></div>`:''}
   <div class="scope muted">🔒 ${c.kind==='cloud'?t.cloudNote:t.revoke}</div>
   <div class="act"><button class="btn" onclick="decide(false)">${t.deny}</button><button class="btn pri" onclick="decide(true)">${t.allow}</button></div>`}
function decide(ok){const t=T(),id=ui.queue.shift(),c=byId(id);if(ok){if(!isOn(id))S.connected.push(id);save();tt(()=>T().allowed(nm(c)))}else{tt(()=>T().denied(nm(c)));if(afterQueue){ui.queue=[];}}render();showPerm()}
function disc(id){S.connected=S.connected.filter(x=>x!==id);save();render()}
function useTpl(id){if(!S.agents.includes(id))S.agents.push(id);save();tt(()=>T().created(L(TPLS.find(x=>x.id===id).name)));render()}
function openDlg(tab){if(tab)ui.tab=tab;document.getElementById('dlg').classList.add('open');render();document.getElementById('q').value=ui.q}
function closeDlg(){document.getElementById('dlg').classList.remove('open');document.getElementById('permBg').classList.remove('open')}
function resetAll(){localStorage.removeItem('aivn.connect');location.reload()}
document.getElementById('openBtn').onclick=()=>openDlg();
document.getElementById('impBtn').onclick=()=>{ui.tab='imp';render()};
document.getElementById('q').oninput=e=>{ui.q=e.target.value;if(ui.tab==='tpl'||ui.tab==='imp')ui.tab='all';render()};
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save();render();const ts=document.querySelector('.toast.show');if(ts&&lastToast)toast(lastToast());if(document.getElementById('permBg').classList.contains('open'))showPerm()});
document.getElementById('dlg').onclick=e=>{if(e.target.id==='dlg')closeDlg()};
renderOuter();if(location.hash==='#open')openDlg();
</script></body></html>
